<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#1d2b3a" />
		<!-- Plain-document fallback: without JavaScript every card reads inline and the button is noise. -->
		<noscript>
			<style>
				.prop > button, .prop form { display: none; }
				.prop > dialog { display: block; position: static; border: 0; padding: 0; }
				/* A remote's card is only its buttons, which need the engine. */
				.prop > dialog.remote { display: none; }
				/* The document the engine would have taken (app.css), shown after all, on the page's own background. */
				html { background: none !important; }
				body > div { visibility: visible !important; }
			</style>
		</noscript>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
