# PROTOTYPE, throwaway (ticket 09). Static build plus the room Durable Object on one Worker.
name = "cursor-sync-proto"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "build"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/ws/*", "/stats/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Turnstile's always-pass test secret; the client uses the matching test site key.
TURNSTILE_SECRET = "1x0000000000000000000000000000000AA"
