# One Worker serves the prerendered build as static assets and runs the rooms.
name = "barmadden"
# The entry holds the two object classes and re-exports the fetch handler from worker/index.ts.
main = "worker/rooms.ts"
compatibility_date = "2026-09-26"
# Production answers only on its custom domain (ticket 07); Previews keep their workers.dev URLs.
workers_dev = false
preview_urls = true

[assets]
directory = "build"
not_found_handling = "404-page"
# Only the socket path runs Worker code; every page and file is served straight from assets.
run_worker_first = ["/ws", "/ws/*"]

[vars]
# The site-wide visitor ceiling: past it, the upgrade is refused and the visitor explores solo. A change is a push.
MAX_VISITORS = 1000

# The room objects, declared by class with SQLite storage (which they never use) and reached through ctx.exports, which
# gives each Preview its own namespace without a binding here.
[exports.Room]
type = "durable-object"
storage = "sqlite"

[exports.Directory]
type = "durable-object"
storage = "sqlite"

# Previews inherit nothing from the top level: every var the Worker reads is repeated here.
[previews.vars]
MAX_VISITORS = 1000
